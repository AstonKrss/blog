name: 自动构建
on:
  push:
    branches:
      - main
  workflow_dispatch:     # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ==================== 前端构建 ====================
      - name: 🟦 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name:  构建 Next.js 前端
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://47.242.21.40:8080
        run: |
          npm ci
          npm run build
      
      - name: ☕ 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # ✅ 注意拼写
          java-version: '21'
          cache: 'maven'  # 可选，启用 Maven 缓存

      # ==================== 后端构建 ====================
      - name: 打包 Spring Boot 后端
        run: mvn clean package -DskipTests

      # ==================== 构建成功提示 ====================
      - name: 完成
        run: echo "前端和后端都构建成功！"
        
      - name: 调试 Secrets
        run: |
          echo "Host: ${{ secrets.ALIYUN_HOST }}"
          echo "User: ${{ secrets.ALIYUN_USER }}"
          echo "Password length: ${{ secrets.ALIYUN_PASSWORD }}"
      
      # ==================== SSH 部署到阿里云 ====================
      - name: 部署到阿里云服务器
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          # key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          script_stop: true  # 遇到错误立即停止
          debug: true  # 添加调试模式
          script: |
            set -e  # 遇到错误退出
            
            cd /root/workspace/blog
            
            # 拉取最新代码
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            git pull origin main
            
            echo "NEXT_PUBLIC_API_URL=http://47.242.21.40:8080" > frontend/.env.production

            docker-compose down
            docker-compose up -d --build
            
            docker image prune -f
            
            echo "部署完成！"