name: 自动构建
on:
  push:
    branches:
      - main
  workflow_dispatch:     # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ==================== 前端构建 ====================
      - name: 🟦 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name:  构建 Next.js 前端
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://47.242.21.40:8080
          PYTHON_API_URL: http://47.242.21.40:8000
        run: |
          npm ci
          npm run build

      # ==================== 后端构建 ====================
      - name: ☕ 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 打包 Spring Boot 后端
        run: mvn clean package -DskipTests

      # ==================== 部署到阿里云 ====================
      - name: 部署到阿里云服务器
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 30m
          debug: true
          script: |
            set -e

            cd /root/workspace/blog

            # 拉取最新代码
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            OLD_SHA=$(git rev-parse HEAD)
            git fetch origin
            NEW_SHA=$(git rev-parse origin/main)
            CHANGED_FILES=$(git diff --name-only "$OLD_SHA" "$NEW_SHA" || true)
            git reset --hard origin/main

            # 生成前端环境变量
            echo "NEXT_PUBLIC_API_URL=http://47.242.21.40:8080" > frontend/.env.production
            echo "PYTHON_API_URL=http://47.242.21.40:8000" >> frontend/.env.production

            # 按变更范围重建服务，避免每次 push 都重建 Python/后端/前端全部镜像
            SERVICES=""
            if echo "$CHANGED_FILES" | grep -qE '(^pom.xml|^Dockerfile.backend|^src/)'; then
              SERVICES="$SERVICES backend"
            fi
            if echo "$CHANGED_FILES" | grep -qE '(^frontend/|^compose.yaml)'; then
              SERVICES="$SERVICES frontend"
            fi
            if echo "$CHANGED_FILES" | grep -qE '(^python/|^compose.yaml)'; then
              SERVICES="$SERVICES python"
            fi
            if echo "$CHANGED_FILES" | grep -qE '(^compose.yaml)'; then
              SERVICES="backend frontend python"
            fi

            docker-compose up -d mysql

            if [ -n "$SERVICES" ]; then
              echo "Changed files:"
              echo "$CHANGED_FILES"
              echo "Rebuilding services:$SERVICES"
              docker-compose up -d --build $SERVICES
            else
              echo "No service code changed; keeping existing containers running."
              docker-compose up -d
            fi

            # 等待服务启动
            sleep 15

            # 健康检查
            curl -sf http://localhost:8080/api/public/health || echo "Backend health check failed"
            curl -sf http://localhost:8000/health || echo "Python service health check failed"
            curl -sf http://localhost:3000/api/public/health || echo "Frontend health check failed"

            echo "======================================"
            echo "部署完成！服务状态："
            echo "  前端: http://47.242.21.40"
            echo "  后端: http://47.242.21.40:8080"
            echo "  Python: http://47.242.21.40:8000"
            echo "======================================"
