name: 自动构建
on:
  push:
    branches:
      - main
  workflow_dispatch:     # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ==================== 前端构建 ====================
      - name: 🟦 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name:  构建 Next.js 前端
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
      
      - name: ☕ 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # ✅ 注意拼写
          java-version: '21'
          cache: 'maven'  # 可选，启用 Maven 缓存

      # ==================== 后端构建 ====================
      - name: 打包 Spring Boot 后端
        run: mvn clean package -DskipTests

      # ==================== 构建成功提示 ====================
      - name: 完成
        run: echo "前端和后端都构建成功！"
        
      # ==================== SSH 部署到阿里云 ====================
      - name: 部署到阿里云服务器
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}  # 改用密码
          port: 22
          script_stop: true  # 遇到错误立即停止
          debug: true  # 添加调试模式
          script: |

            echo "SSH 连接成功！"
            cd /root/workspace/blog/

            git pull origin main

            docker-compose down
            docker-compose up -d --build

            # 启动新的后端服务

            