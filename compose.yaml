services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "Chuyangqi123@@"
      MYSQL_DATABASE: myblog
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: "Aston123@@blog"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pChuyangqi123@@"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 后端 Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: blog-backend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - .:/uploads:/va/blog/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/myblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: bloguser
      SPRING_DATASOURCE_PASSWORD: "Aston123@@blog"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog-network

  # 前端 Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://47.242.21.40:8080
    container_name: blog-frontend
    restart: always
    ports:
      - "80:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://47.242.21.40:8080
    depends_on:
      - backend
    networks:
      - blog-network

volumes:
  mysql_data:

networks:
  blog-network:
    driver: bridge