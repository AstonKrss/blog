services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chuyangqi123@@
      MYSQL_DATABASE: myblog
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: Aston123@@blog
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 后端 Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: blog-backend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      # 共享 uploads 目录：主机 ./uploads ↔ 容器 /app/uploads
      - ./uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/myblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: bloguser
      SPRING_DATASOURCE_PASSWORD: Aston123@@blog
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: mySecretKeyForJwtTokenGenerationThatIsLongEnough
      JWT_EXPIRATION: 86400000
      # QQ 邮件配置
      MAIL_HOST: smtp.qq.com
      MAIL_PORT: 587
      MAIL_USERNAME: 3223957215@qq.com
      MAIL_PASSWORD: wsukckbbexiccifh
      BLOG_SITE_URL: http://47.242.21.40:8080
      BLOG_OWNER_EMAIL: aston@example.com
      BLOG_OWNER_NAME: Aston
      # Cookie 域名设置（关键：让前端页面能共享 httpOnly cookie）
      COOKIE_DOMAIN: 47.242.21.40
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog-network

  # 前端 Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://47.242.21.40:8080
    container_name: blog-frontend
    restart: always
    ports:
      - "80:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://47.242.21.40:8080
    volumes:
      # 共享 uploads 目录：主机 ./uploads ↔ 容器 /app/uploads
      - ./uploads:/app/uploads
    depends_on:
      - backend
    networks:
      - blog-network

volumes:
  mysql_data:

networks:
  blog-network:
    driver: bridge