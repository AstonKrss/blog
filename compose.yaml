services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: myblog
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 后端 Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: blog-backend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      # 共享 uploads 目录：主机 ./uploads ↔ 容器 /app/uploads
      - ./uploads:/app/uploads
    environment:
      # 文件上传大小限制
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100MB
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/myblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: bloguser
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRATION: 86400000
      # QQ 邮件配置
      MAIL_HOST: smtp.qq.com
      MAIL_PORT: 587
      MAIL_USERNAME: 3223957215@qq.com
      MAIL_PASSWORD: ${MAIL_PASSWORD:?请在 .env 中设置 MAIL_PASSWORD}
      BLOG_SITE_URL: http://47.242.21.40:8080
      BLOG_OWNER_EMAIL: aston@example.com
      BLOG_OWNER_NAME: Aston
      BLOG_UPLOAD_DIR: /app/uploads
      # 多实例共享文件存储；本地开发可改为 local
      BLOG_STORAGE_TYPE: minio
      BLOG_MINIO_ENDPOINT: http://minio:9000
      BLOG_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      BLOG_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      BLOG_MINIO_BUCKET: blog
      # Cookie 域名设置（关键：让前端页面能共享 httpOnly cookie）
      COOKIE_DOMAIN: 47.242.21.40
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SPRING_RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - blog-network
  # 前端 Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://47.242.21.40:8080
    container_name: blog-frontend
    restart: always
    ports:
      - "80:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://47.242.21.40:8080
      PYTHON_API_URL: http://python:8000    # 新增
    volumes:
      # 共享 uploads 目录：主机 ./uploads ↔ 容器 /app/uploads
      - ./uploads:/app/uploads
    depends_on:
      - backend
    networks:
      - blog-network

  # Python 安全工具
  python:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: blog-python
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: myblog
      DB_USER: bloguser
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://47.242.21.40,http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog-network
  minio:
    image: minio/minio:latest
    container_name: blog-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - blog-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: blog-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?请在 .env 中设置 RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?请在 .env 中设置 RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - blog-network
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - blog-network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
networks:
  blog-network:
    driver: bridge
