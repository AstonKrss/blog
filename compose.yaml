services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: myblog
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: blog123
    ports:
      - "3306:3306"
    volumes:
      - ./myblog.sql:/docker-entrypoint-initdb.d/myblog.sql
      - mysql_data:/var/lib/mysql
    networks:
      - blog-network

  # 后端 Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: blog-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/myblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: bloguser
      SPRING_DATASOURCE_PASSWORD: blog123
    depends_on:
      - mysql
    networks:
      - blog-network

  # 前端 Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blog-frontend
    restart: always
    ports:
      - "80:3000"
    environment:
      API_BASE: http://localhost:8080
    depends_on:
      - backend
    networks:
      - blog-network

volumes:
  mysql_data:

networks:
  blog-network:
    driver: bridge