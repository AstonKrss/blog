spring:
  application:
    name: blog

  # 文件上传大小限制（这个优先级更高）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      enabled: true

  # 数据库配置（生产环境用环境变量）
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 常驻 10 个空闲连接；并发升高时最多扩到 20 个连接。
      # 注意：minimum-idle 是空闲连接下限，不是线程池的“核心线程数”。
      minimum-idle: ${BLOG_DB_POOL_MIN_IDLE:10}
      maximum-pool-size: ${BLOG_DB_POOL_MAX_SIZE:20}


  # JPA/Hibernate 配置
  jpa:
    hibernate:
      ddl-auto: validate        # 开发阶段用 update，生产环境建议改成 validate
    show-sql: false           # 生产环境关闭 SQL 日志
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有数据库没有 flyway_schema_history 时，以版本 1 作为基线，避免重复执行历史索引脚本。
    # 空数据库不会走 baseline，会完整执行 V1、V2。
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  # 邮件配置（生产环境用环境变量）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:3223957215@qq.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Docker Compose 禁用
  docker:
    compose:
      enabled: false

  data:
      # Redis 配置（生产环境用环境变量）
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms        # 命令超时:防止 Lettuce 共享连接 hang 死整个请求
      lettuce:
        pool:
          enabled: true       # 启用连接池,避免共享连接在异常时阻塞所有请求
          max-active: 16      # 最大连接数
          max-idle: 8
          min-idle: 1
          max-wait: 1000ms    # 获取连接最大等待
        shutdown-timeout: 200ms

    # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10分钟
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "blog:"

# 可观测性（阶段0）
# 只暴露监控需要的端点；不要把 env、heapdump 等敏感端点暴露到公网。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      # 邮件服务（QQ SMTP）是外部依赖，不应让 /actuator/health 总体变 DOWN，
      # 否则压测或负载均衡会因为邮件失败误判后端不可用。
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 开启直方图桶，Prometheus 才能用 histogram_quantile 计算 P50/P95/P99
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    enable:
      jvm: true
      hikaricp: true
      cache: true

logging:
  pattern:
    # traceId 由 RequestIdFilter 写入 MDC；无请求上下文的后台任务显示 "-"
    level: "%5p [${spring.application.name:blog},%X{traceId:-}]"

# 服务器配置
server:
  port: 8080
  # 文件上传大小限制
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  # Tomcat 配置（备用）
  tomcat:
    max-swallow-size: 100MB

# 博客站点配置
blog:
  # D-01: 上传根目录统一配置，容器通过环境变量覆盖
  upload-dir: ${BLOG_UPLOAD_DIR:./uploads}
  # 存储模式：local（默认，单机）或 minio（多实例共享）
  storage:
    type: ${BLOG_STORAGE_TYPE:local}
    minio:
      endpoint: ${BLOG_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${BLOG_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${BLOG_MINIO_SECRET_KEY:minioadmin}
      bucket: ${BLOG_MINIO_BUCKET:blog}
      region: ${BLOG_MINIO_REGION:us-east-1}
  # 压测开关：关闭访问日志后不写 visit_logs，用于分离读写压力
  visit-log:
    enabled: ${BLOG_VISIT_LOG_ENABLED:true}
    # 明细保留天数；聚合数据保留天数
    retention-days: ${BLOG_VISIT_LOG_RETENTION_DAYS:90}
    aggregate-retention-days: ${BLOG_VISIT_LOG_AGGREGATE_RETENTION_DAYS:400}
    aggregation:
      enabled: ${BLOG_VISIT_LOG_AGGREGATION_ENABLED:true}
      interval-ms: ${BLOG_VISIT_LOG_AGGREGATION_INTERVAL_MS:300000}
      initial-delay-ms: ${BLOG_VISIT_LOG_AGGREGATION_INITIAL_DELAY_MS:60000}
  # MySQL 慢查询指标采集间隔
  mysql:
    slow-query:
      refresh-ms: ${BLOG_MYSQL_SLOW_QUERY_REFRESH_MS:30000}
  # 点赞数周期校准
  post-like:
    calibration:
      enabled: ${BLOG_POST_LIKE_CALIBRATION_ENABLED:true}
      interval-ms: ${BLOG_POST_LIKE_CALIBRATION_INTERVAL_MS:3600000}
      initial-delay-ms: ${BLOG_POST_LIKE_CALIBRATION_INITIAL_DELAY_MS:300000}
  # 热门文章缓存预热
  cache:
    enabled: ${BLOG_CACHE_ENABLED:true}
    warmup:
      enabled: ${BLOG_CACHE_WARMUP_ENABLED:true}
      top-n: ${BLOG_CACHE_WARMUP_TOP_N:50}
      interval-ms: ${BLOG_CACHE_WARMUP_INTERVAL_MS:600000}
      initial-delay-ms: ${BLOG_CACHE_WARMUP_INITIAL_DELAY_MS:120000}
  site:
    url: ${BLOG_SITE_URL:http://localhost:8080}
  owner:
    email: ${BLOG_OWNER_EMAIL:}
    name: ${BLOG_OWNER_NAME:Aston}

