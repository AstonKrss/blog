spring:
  datasource:
    url: jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update        # 开发阶段用 update，生产环境建议改成 validate
    show-sql: true            # 控制台打印 SQL 语句，方便调试
    open-in-view: false

  docker:
    compose:
      enabled: false
server:
  port: 8080