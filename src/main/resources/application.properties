spring.application.name=blog
spring.docker.compose.enabled=false

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration (使用环境变量，生产环境必须设置)
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnly12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# QQ Mail configuration (使用环境变量，不要硬编码)
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Blog site configuration
blog.site.url=${BLOG_SITE_URL:http://localhost:8080}
blog.owner.email=${BLOG_OWNER_EMAIL:}
blog.owner.name=${BLOG_OWNER_NAME:Aston}
